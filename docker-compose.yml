services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: hairvision-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: hairvision
      POSTGRES_USER: hairvision
      POSTGRES_PASSWORD: hairvision_dev_password

    ports:
      - "5432:5432"

    volumes:
      - hairvision_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U hairvision -d hairvision"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hairvision_postgres_data: